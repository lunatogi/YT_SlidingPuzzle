<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Sliding Puzzle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

:root {
  --bg:        #080b12;
  --surface:   #0e1420;
  --surface2:  #131a28;
  --border:    rgba(100,160,255,0.15);
  --accent:    #4af0c4;
  --accent2:   #ff5e7e;
  --accent3:   #ffc845;
  --blue:      #5b9fff;
  --text:      #e8eef8;
  --muted:     rgba(200,220,255,0.4);
  --glow-g:    0 0 20px rgba(74,240,196,0.4);
  --glow-r:    0 0 20px rgba(255,94,126,0.5);
  --glow-b:    0 0 16px rgba(91,159,255,0.35);
  --grid-sz:   min(78vw, 78vh, 760px);
  --panel-w:   min(82vw, 820px);
  --gap:       6px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  position: relative;
  background:
    radial-gradient(circle at 50% 34%, rgba(74,240,196,0.2), transparent 20%),
    radial-gradient(circle at 50% 44%, rgba(91,159,255,0.22), transparent 34%),
    radial-gradient(circle at 50% 100%, rgba(8,15,28,0), rgba(8,15,28,0.78) 72%),
    linear-gradient(180deg, rgba(8,13,22,0.12) 0%, rgba(8,13,22,0.56) 100%);
  font-family: 'Rajdhani', sans-serif;
  color: var(--text);
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: clamp(30px, 4vh, 56px) clamp(18px, 3vw, 34px) clamp(22px, 2vh, 30px);
  gap: clamp(10px, 1.1vh, 16px);
  isolation: isolate;
}

body::before,
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
}

body::before {
  background:
    linear-gradient(rgba(120,170,255,0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,170,255,0.055) 1px, transparent 1px),
    radial-gradient(circle at 50% 38%, rgba(255,255,255,0.05), transparent 48%);
  background-size: 68px 68px, 68px 68px, auto;
  mask-image: radial-gradient(circle at 50% 42%, rgba(0,0,0,0.9), transparent 78%);
  opacity: 0.42;
}

body::after {
  background:
    radial-gradient(circle at 50% 40%, rgba(74,240,196,0.22) 0%, transparent 18%),
    radial-gradient(circle at 50% 48%, rgba(91,159,255,0.18), transparent 28%),
    radial-gradient(circle at 14% 18%, rgba(91,159,255,0.12), transparent 18%),
    radial-gradient(circle at 86% 18%, rgba(74,240,196,0.1), transparent 16%);
  filter: blur(18px);
}

body > *:not(#complete-screen):not(#celebration-layer) {
  position: relative;
  z-index: 1;
}

body > *:not(.grid-outer):not(#complete-screen):not(#celebration-layer) {
  backdrop-filter: blur(10px);
}

.header,
.timer-wrap,
.votes-panel {
  background: linear-gradient(180deg, rgba(12,19,31,0.72), rgba(12,19,31,0.5));
  border: 1px solid rgba(100,160,255,0.14);
  box-shadow:
    0 18px 50px rgba(0,0,0,0.2),
    inset 0 1px 0 rgba(255,255,255,0.03);
}

.header,
.timer-wrap {
  border-radius: 16px;
  padding: 14px 18px;
}

/* ── HEADER ─────────────────────────────────────────────── */
.header {
  width: var(--panel-w);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-top: clamp(10px, 1.5vh, 22px);
}

.title-block { display: flex; flex-direction: column; gap: 1px; }

.title {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(38px, 3.4vw, 58px);
  letter-spacing: 4px;
  color: var(--accent);
  text-shadow: var(--glow-g);
  line-height: 1;
}

.subtitle {
  font-size: clamp(26px, 2vw, 40px);
  letter-spacing: 3.5px;
  color: var(--muted);
  text-transform: uppercase;
}

.stats-block {
  display: flex;
  gap: 18px;
}

.stat {
  text-align: center;
}

.stat-label {
  font-size: clamp(22px, 1.7vw, 32px);
  letter-spacing: 2.5px;
  color: var(--muted);
  text-transform: uppercase;
  display: block;
}

.stat-value {
  font-family: 'Orbitron', monospace;
  font-size: clamp(34px, 2.8vw, 48px);
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
}

/* ── DIVIDER ─────────────────────────────────────────────── */
.divider {
  width: var(--panel-w);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), var(--accent), var(--border), transparent);
  opacity: 0.6;
}

/* ── GRID WRAPPER ────────────────────────────────────────── */
.grid-outer {
  position: relative;
  width: var(--grid-sz);
  height: var(--grid-sz);
  flex-shrink: 0;
  margin-top: clamp(18px, 2.5vh, 34px);
}

.axis-labels-col {
  position: absolute;
  top: -42px;
  left: 0;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  text-align: center;
  font-family: 'Orbitron', monospace;
  font-size: clamp(28px, 2.4vw, 42px);
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 2px;
  text-shadow: 0 0 18px rgba(91,159,255,0.5);
}

.axis-labels-row {
  position: absolute;
  left: -38px;
  top: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  font-family: 'Orbitron', monospace;
  font-size: clamp(28px, 2.4vw, 42px);
  font-weight: 700;
  color: var(--blue);
  text-shadow: 0 0 18px rgba(91,159,255,0.5);
}

/* corner glow decoration */
.grid-outer::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(74,240,196,0.15), transparent 40%, rgba(91,159,255,0.1) 100%);
  pointer-events: none;
  z-index: 0;
}

#grid {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: var(--gap);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--border);
  box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.4);
  transition: opacity 1.2s ease, filter 1.2s ease;
}

.grid-outer.solved-reveal #grid {
  opacity: 0.12;
  filter: saturate(0.7) blur(2px);
}

.grid-outer.solved-reveal .axis-labels-col,
.grid-outer.solved-reveal .axis-labels-row {
  opacity: 0.22;
  transition: opacity 1.2s ease;
}

/* ── CELLS ───────────────────────────────────────────────── */
.cell {
  position: relative;
  overflow: hidden;
  background: var(--surface);
  transition: box-shadow 0.25s, border-color 0.25s;
  will-change: transform;
}

.cell::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 3;
}

.cell.blank {
  background: rgba(8,11,18,0.8);
}

.cell.blank::after { display: none; }

/* inner glow border for movable */
.cell.movable {
  background:
    linear-gradient(180deg, rgba(74,240,196,0.24), rgba(74,240,196,0.05)),
    var(--surface);
  box-shadow:
    inset 0 0 0 5px rgba(74,240,196,0.98),
    inset 0 0 52px rgba(74,240,196,0.46),
    0 0 34px rgba(74,240,196,0.45),
    0 0 70px rgba(74,240,196,0.18);
}

.cell.movable .cell-label {
  color: #071217;
  background: rgba(74,240,196,1);
  border-color: rgba(74,240,196,1);
  text-shadow: none;
  box-shadow: 0 0 24px rgba(74,240,196,0.55);
}

/* flash on move */
.cell.just-moved {
  animation: flash-move 0.5s ease forwards;
}

.cell.sliding {
  z-index: 6;
}

@keyframes flash-move {
  0%   { box-shadow: inset 0 0 0 2px var(--accent2), inset 0 0 30px rgba(255,94,126,0.35); }
  100% { box-shadow: none; }
}

.cell img {
  position: absolute;
  inset: 0;
  object-fit: cover;
  pointer-events: none;
  z-index: 1;
}

.cell-label {
  position: absolute;
  top: 8px;
  left: 8px;
  font-family: 'Orbitron', monospace;
  font-size: clamp(20px, 1.6vw, 30px);
  font-weight: 700;
  color: rgba(255,255,255,0.92);
  text-shadow: 0 2px 10px rgba(0,0,0,0.95);
  z-index: 4;
  transition: color 0.2s, text-shadow 0.2s;
  letter-spacing: 1px;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(6, 11, 18, 0.66);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(4px);
}

.cell.movable .cell-label {
  color: #071217;
  background: rgba(74,240,196,0.92);
  border-color: rgba(74,240,196,1);
  text-shadow: none;
  box-shadow: 0 0 18px rgba(74,240,196,0.4);
}

/* ── TIMER ───────────────────────────────────────────────── */
.timer-wrap {
  width: var(--panel-w);
  display: flex;
  align-items: center;
  gap: 10px;
}

.timer-track {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}

.timer-fill {
  height: 100%;
  width: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--blue), var(--accent));
  transition: width 0.12s linear;
  position: relative;
}

.timer-fill::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 12px;
  background: rgba(255,255,255,0.6);
  filter: blur(3px);
  border-radius: 2px;
}

.timer-fill.urgent {
  background: linear-gradient(90deg, #a00020, var(--accent2));
  animation: urgentpulse 0.35s infinite alternate;
}

@keyframes urgentpulse {
  from { opacity: 0.75; }
  to   { opacity: 1; }
}

.timer-num {
  font-family: 'Orbitron', monospace;
  font-size: clamp(28px, 2vw, 38px);
  font-weight: 700;
  color: var(--accent);
  min-width: 52px;
  text-align: right;
  transition: color 0.3s;
}

.timer-num.urgent { color: var(--accent2); text-shadow: var(--glow-r); }

/* ── VOTES PANEL ─────────────────────────────────────────── */
.votes-panel {
  width: var(--panel-w);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  min-height: 80px;
}

.votes-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 7px;
}

.votes-title {
  font-size: clamp(16px, 1.2vw, 22px);
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  font-family: 'Orbitron', monospace;
}

.vote-hint {
  font-size: clamp(16px, 1.2vw, 22px);
  color: var(--muted);
}

.vote-hint strong {
  color: var(--accent3);
  font-family: 'Orbitron', monospace;
  font-size: clamp(16px, 1.2vw, 22px);
}

.votes-grid {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.vote-bar-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 60px;
  flex: 1;
}

.vote-bar-track {
  width: 100%;
  height: 34px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}

.vote-bar-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, var(--blue), rgba(91,159,255,0.4));
  transition: height 0.3s ease;
  border-radius: 3px 3px 0 0;
}

.vote-bar-fill.leading {
  background: linear-gradient(180deg, var(--accent), rgba(74,240,196,0.4));
  box-shadow: 0 0 8px rgba(74,240,196,0.4);
}

.vote-bar-count {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', monospace;
  font-size: clamp(18px, 1.4vw, 26px);
  font-weight: 700;
  color: rgba(255,255,255,0.9);
  z-index: 1;
}

.vote-bar-label {
  font-family: 'Orbitron', monospace;
  font-size: clamp(15px, 1.1vw, 22px);
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
}

.vote-bar-item.leading .vote-bar-label {
  color: var(--accent);
}

.votes-empty {
  font-size: clamp(18px, 1.3vw, 24px);
  color: rgba(255,255,255,0.18);
  font-style: italic;
  padding: 4px 0;
}

@media (max-aspect-ratio: 9/16) {
  :root {
    --grid-sz: min(82vw, 52vh, 820px);
    --panel-w: min(88vw, 860px);
  }

  body {
    justify-content: flex-start;
    padding-top: clamp(18px, 2vh, 30px);
  }

  .header {
    flex-direction: column;
    align-items: flex-start;
  }

  .stats-block {
    width: 100%;
    justify-content: space-between;
  }
}

/* ── COMPLETE SCREEN ─────────────────────────────────────── */
#complete-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(8,11,18,0.97);
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: clamp(20px, 2.4vh, 36px);
  padding: clamp(88px, 14vh, 184px) clamp(28px, 4vw, 56px) clamp(28px, 3vh, 44px);
  z-index: 200;
}

#complete-screen::before,
#complete-screen::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#complete-screen::before {
  background:
    radial-gradient(circle at 50% 40%, rgba(74,240,196,0.18), transparent 28%),
    radial-gradient(circle at 50% 44%, rgba(91,159,255,0.16), transparent 38%);
  filter: blur(18px);
  opacity: 0;
}

#complete-screen::after {
  background:
    linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.08) 48%, transparent 52%),
    linear-gradient(60deg, transparent 0%, rgba(74,240,196,0.05) 46%, transparent 54%);
  mix-blend-mode: screen;
  opacity: 0;
}

#complete-screen.show {
  display: flex;
  animation: comp-in 0.7s cubic-bezier(0.16,1,0.3,1) both;
}

#complete-screen.show::before {
  animation: complete-aura 1.4s ease-out forwards;
}

#complete-screen.show::after {
  animation: complete-sheen 1.1s ease-out 0.1s forwards;
}

@keyframes comp-in {
  from { opacity:0; transform: scale(0.93) translateY(10px); }
  to   { opacity:1; transform: scale(1) translateY(0); }
}

@keyframes complete-aura {
  0%   { opacity: 0; transform: scale(0.86); }
  30%  { opacity: 1; }
  100% { opacity: 0.78; transform: scale(1.06); }
}

@keyframes complete-sheen {
  0%   { opacity: 0; transform: translateX(-24%) translateY(-8%) scale(1.2); }
  35%  { opacity: 0.9; }
  100% { opacity: 0; transform: translateX(24%) translateY(8%) scale(1); }
}

.confetti-burst {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 170;
}

.solved-image-reveal {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 4;
  border-radius: 10px;
  overflow: hidden;
}

.solved-image-reveal::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 42%, rgba(74,240,196,0.14), transparent 32%),
    linear-gradient(180deg, rgba(8,11,18,0.08), rgba(8,11,18,0.34));
}

.solved-image-reveal img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid rgba(100,160,255,0.24);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03) inset,
    0 22px 60px rgba(0,0,0,0.32),
    0 0 46px rgba(91,159,255,0.22);
  transform: scale(0.94);
  opacity: 0;
}

.solved-image-reveal.active {
  animation: solved-image-wrap-in 1.3s ease-out forwards;
}

.solved-image-reveal.active img {
  animation: solved-image-in 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes solved-image-wrap-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@keyframes solved-image-in {
  0% {
    opacity: 0;
    transform: scale(0.94);
    filter: saturate(0.82) brightness(0.88);
  }
  100% {
    opacity: 1;
    transform: scale(1);
    filter: saturate(1) brightness(1);
  }
}

.confetti-piece {
  position: absolute;
  top: var(--top);
  left: var(--left);
  width: var(--size);
  height: calc(var(--size) * 2.5);
  border-radius: 999px;
  opacity: 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.02)),
    var(--color);
  box-shadow:
    0 0 12px color-mix(in srgb, var(--color) 55%, transparent),
    0 0 24px color-mix(in srgb, var(--color) 28%, transparent);
  transform: translate3d(0, 0, 0) rotate(0deg) scale(0.72);
}

.confetti-burst.active .confetti-piece {
  animation: confetti-spray var(--dur) cubic-bezier(0.18, 0.72, 0.26, 1) var(--delay) forwards;
}

@keyframes confetti-spray {
  0% {
    opacity: 0;
    transform: translate3d(0, 0, 0) rotate(0deg) scale(0.72);
  }
  10% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--spin)) scale(1);
  }
}

.comp-badge {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(22px, 1.8vw, 34px);
  letter-spacing: 8px;
  color: var(--accent3);
  text-transform: uppercase;
  border: 1px solid var(--accent3);
  padding: 12px 28px;
  border-radius: 6px;
  text-shadow: 0 0 12px rgba(255,200,69,0.5);
  box-shadow: 0 0 16px rgba(255,200,69,0.15);
  position: relative;
  z-index: 2;
}

.comp-title {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(86px, 9vw, 180px);
  letter-spacing: 8px;
  color: var(--accent);
  text-shadow: var(--glow-g), 0 0 60px rgba(74,240,196,0.2);
  text-align: center;
  line-height: 1;
  position: relative;
  z-index: 2;
}

.comp-meta {
  display: flex;
  gap: clamp(24px, 3vw, 56px);
  width: min(92vw, 1100px);
  justify-content: center;
  position: relative;
  z-index: 2;
}

.comp-restart {
  width: min(92vw, 1100px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 18px 26px;
  background: rgba(91,159,255,0.12);
  border: 1px solid rgba(91,159,255,0.24);
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(91,159,255,0.12);
  position: relative;
  z-index: 2;
}

.comp-restart-label {
  font-family: 'Orbitron', monospace;
  font-size: clamp(20px, 1.5vw, 28px);
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}

.comp-restart-value {
  font-family: 'Orbitron', monospace;
  font-size: clamp(40px, 3vw, 64px);
  font-weight: 900;
  color: var(--blue);
  text-shadow: var(--glow-b);
  line-height: 1;
}

.comp-stat {
  text-align: center;
  flex: 1;
  padding: clamp(18px, 2vw, 30px);
  background: rgba(14,20,32,0.86);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(0,0,0,0.24);
}

.comp-stat-val {
  font-family: 'Orbitron', monospace;
  font-size: clamp(56px, 5vw, 96px);
  font-weight: 700;
  color: var(--text);
  line-height: 1;
}

.comp-stat-lbl {
  font-size: clamp(20px, 1.5vw, 30px);
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 8px;
}

.lb-wrap {
  width: min(92vw, 1100px);
  background: rgba(14,20,32,0.9);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.28);
  position: relative;
  z-index: 2;
}

.lb-head {
  padding: 18px 24px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  font-family: 'Orbitron', monospace;
  font-size: clamp(20px, 1.6vw, 30px);
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
  text-align: center;
}

.lb-entry {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 18px 24px;
  border-bottom: 1px solid rgba(100,160,255,0.06);
  transition: background 0.2s;
}

.lb-entry:last-child { border-bottom: none; }

.lb-entry:nth-child(1) { background: rgba(255,200,69,0.06); }
.lb-entry:nth-child(2) { background: rgba(180,180,180,0.04); }
.lb-entry:nth-child(3) { background: rgba(180,100,50,0.04); }

.lb-rank {
  font-family: 'Orbitron', monospace;
  font-size: clamp(40px, 3vw, 64px);
  font-weight: 900;
  min-width: 72px;
  text-align: center;
  color: var(--muted);
}

.lb-entry:nth-child(1) .lb-rank { color: var(--accent3); text-shadow: 0 0 10px rgba(255,200,69,0.5); }
.lb-entry:nth-child(2) .lb-rank { color: #c8c8d0; }
.lb-entry:nth-child(3) .lb-rank { color: #cd8860; }

.lb-name { flex:1; font-size: clamp(28px, 2.2vw, 44px); font-weight: 600; letter-spacing: 0.5px; }
.lb-votes {
  font-family: 'Orbitron', monospace;
  font-size: clamp(24px, 1.8vw, 34px);
  color: var(--accent);
  font-weight: 700;
}

@media (max-width: 900px) {
  .comp-meta {
    flex-direction: column;
  }

  .comp-title {
    font-size: clamp(72px, 14vw, 140px);
  }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="title-block">
    <div class="title">SLIDEPUZZLE</div>
    <div class="subtitle">Type !A1 · !B2 · !C3 to vote</div>
  </div>
  <div class="stats-block">
    <div class="stat">
      <span class="stat-label">Moves</span>
      <span class="stat-value" id="stat-moves">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Time</span>
      <span class="stat-value" id="stat-time">0:00</span>
    </div>
  </div>
</div>

<div class="divider"></div>

<!-- GRID -->
<div class="grid-outer">
  <div class="axis-labels-col"><div>A</div><div>B</div><div>C</div></div>
  <div class="axis-labels-row"><div>1</div><div>2</div><div>3</div></div>
  <div id="grid"></div>
  <div class="solved-image-reveal" id="solved-image-reveal">
    <img id="solved-image" alt="Solved puzzle image"/>
  </div>
</div>

<!-- TIMER -->
<div class="timer-wrap">
  <div class="timer-track">
    <div class="timer-fill" id="timer-fill"></div>
  </div>
  <div class="timer-num" id="timer-num">20</div>
</div>

<!-- VOTES -->
<div class="votes-panel">
  <div class="votes-header">
    <div class="votes-title">Live Votes</div>
    <div class="vote-hint">Chat: <strong>!B2</strong></div>
  </div>
  <div class="votes-grid" id="votes-grid">
    <div class="votes-empty">Waiting for vote window…</div>
  </div>
</div>

<div class="confetti-burst" id="celebration-layer"></div>

<!-- COMPLETE -->
<div id="complete-screen">
  <div class="comp-badge">Puzzle Complete</div>
  <div class="comp-title">SOLVED!</div>
  <div class="comp-meta">
    <div class="comp-stat">
      <div class="comp-stat-val" id="c-time">—</div>
      <div class="comp-stat-lbl">Time</div>
    </div>
    <div class="comp-stat">
      <div class="comp-stat-val" id="c-moves">—</div>
      <div class="comp-stat-lbl">Moves</div>
    </div>
  </div>
  <div class="comp-restart">
    <div class="comp-restart-label">Next Puzzle In</div>
    <div class="comp-restart-value" id="c-restart">30s</div>
  </div>
  <div class="lb-wrap">
    <div class="lb-head">Top Contributors</div>
    <div id="lb-body"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const GRID = 3;
const RESTART_TOTAL_MS = 30000;
const COMPLETE_PANEL_DELAY_MS = 5000;
const socket = io();

let board        = [];
let emptyPos     = 8;
let currentImage = null;
let movableCells = [];
let voteData     = {};   // { index: { label, count, firstTime } }
let timerInterval = null;
let timerEnd      = null;
let timerDuration = 20000;
let clockInterval = null;
let roundStart    = null;
let restartInterval = null;
let completePanelTimeout = null;

function buildConfettiBurst() {
  const burst = document.getElementById("celebration-layer");
  const colors = [
    "rgba(74,240,196,0.95)",
    "rgba(91,159,255,0.95)",
    "rgba(255,200,69,0.95)",
    "rgba(255,94,126,0.88)"
  ];

  burst.innerHTML = Array.from({ length: 96 }, (_, i) => {
    const side = ["top", "right", "bottom", "left"][i % 4];
    const size = `${8 + Math.random() * 12}px`;
    const dur = `${3.2 + Math.random() * 2.2}s`;
    const delay = `${Math.random() * 0.85}s`;
    const color = colors[i % colors.length];
    const spin = `${(Math.random() - 0.5) * 1080}deg`;
    let left;
    let top;
    let dx;
    let dy;

    if (side === "top") {
      left = `${Math.random() * 100}%`;
      top = "-10vh";
      dx = `${(Math.random() - 0.5) * 30}vw`;
      dy = `${112 + Math.random() * 16}vh`;
    } else if (side === "bottom") {
      left = `${Math.random() * 100}%`;
      top = "108vh";
      dx = `${(Math.random() - 0.5) * 30}vw`;
      dy = `-${112 + Math.random() * 16}vh`;
    } else if (side === "left") {
      left = "-8vw";
      top = `${Math.random() * 100}%`;
      dx = `${114 + Math.random() * 18}vw`;
      dy = `${(Math.random() - 0.5) * 46}vh`;
    } else {
      left = "108vw";
      top = `${Math.random() * 100}%`;
      dx = `-${114 + Math.random() * 18}vw`;
      dy = `${(Math.random() - 0.5) * 46}vh`;
    }

    return `<span class="confetti-piece" style="--left:${left};--top:${top};--dx:${dx};--dy:${dy};--spin:${spin};--size:${size};--dur:${dur};--delay:${delay};--color:${color}"></span>`;
  }).join("");
}

function showSolvedImage() {
  const reveal = document.getElementById("solved-image-reveal");
  const img = document.getElementById("solved-image");
  const gridOuter = document.querySelector(".grid-outer");

  if (!currentImage) {
    reveal.classList.remove("active");
    gridOuter?.classList.remove("solved-reveal");
    img.removeAttribute("src");
    return;
  }

  img.src = `/images/${currentImage}`;
  gridOuter?.classList.add("solved-reveal");
  reveal.classList.remove("active");
  void reveal.offsetWidth;
  reveal.classList.add("active");
}

function hideSolvedImage() {
  const reveal = document.getElementById("solved-image-reveal");
  const img = document.getElementById("solved-image");
  const gridOuter = document.querySelector(".grid-outer");
  reveal.classList.remove("active");
  gridOuter?.classList.remove("solved-reveal");
  img.removeAttribute("src");
}

// ── RENDER GRID ───────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for (let i = 0; i < GRID * GRID; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.id = `cell-${i}`;

    const col = i % GRID;
    const row = Math.floor(i / GRID);
    const label = String.fromCharCode(65 + col) + (row + 1);
    const tileVal = board[i];

    if (tileVal === 0) {
      cell.classList.add("blank");
    } else {
      cell.dataset.tile = String(tileVal);
      if (currentImage) {
        const img = document.createElement("img");
        img.src = `/images/${currentImage}`;
        img.draggable = false;
        // Position the image slice correctly
        const origIdx = tileVal - 1;
        const oCol = origIdx % GRID;
        const oRow = Math.floor(origIdx / GRID);
        const pct = 100 / GRID; // 33.333...
        img.style.width  = `${GRID * 100}%`;
        img.style.height = `${GRID * 100}%`;
        img.style.left   = `${-oCol * pct * GRID}%`;
        img.style.top    = `${-oRow * pct * GRID}%`;
        cell.appendChild(img);
      }
      const lbl = document.createElement("div");
      lbl.className = "cell-label";
      lbl.textContent = label;
      cell.appendChild(lbl);

    }

    if (movableCells.includes(i)) cell.classList.add("movable");
    grid.appendChild(cell);
  }
}

// ── RENDER VOTES ──────────────────────────────────────────
function renderVotes() {
  const container = document.getElementById("votes-grid");
  const entries = Object.values(voteData);

  if (entries.length === 0) {
    container.innerHTML = '<div class="votes-empty">Waiting for votes…</div>';
    return;
  }

  const maxCount = Math.max(...entries.map(e => e.count), 1);

  container.innerHTML = entries.map(e => {
    const isLeading = e.count > 0 && e.count === maxCount;
    const fillPct = (e.count / maxCount) * 100;
    return `
      <div class="vote-bar-item ${isLeading ? 'leading' : ''}">
        <div class="vote-bar-track">
          <div class="vote-bar-fill ${isLeading ? 'leading' : ''}" style="height:${fillPct}%"></div>
          <div class="vote-bar-count">${e.count > 0 ? e.count : ''}</div>
        </div>
        <div class="vote-bar-label">!${e.label}</div>
      </div>`;
  }).join("");
}

// ── TIMER ─────────────────────────────────────────────────
function startTimer(durationMs) {
  if (timerInterval) clearInterval(timerInterval);
  timerDuration = durationMs;
  timerEnd = Date.now() + durationMs;
  const fill = document.getElementById("timer-fill");
  const num  = document.getElementById("timer-num");

  timerInterval = setInterval(() => {
    const remaining = Math.max(0, timerEnd - Date.now());
    const pct  = (remaining / timerDuration) * 100;
    fill.style.width = pct + "%";
    const secs = Math.ceil(remaining / 1000);
    num.textContent = secs;
    const urgent = secs <= 5;
    fill.classList.toggle("urgent", urgent);
    num.classList.toggle("urgent", urgent);
    if (remaining <= 0) clearInterval(timerInterval);
  }, 100);
}

// ── CLOCK ─────────────────────────────────────────────────
function startClock(from) {
  roundStart = from || Date.now();
  if (clockInterval) clearInterval(clockInterval);
  clockInterval = setInterval(() => {
    const el = Math.floor((Date.now() - roundStart) / 1000);
    const m = Math.floor(el / 60);
    const s = String(el % 60).padStart(2, "0");
    document.getElementById("stat-time").textContent = `${m}:${s}`;
  }, 1000);
}

function stopRestartCountdown() {
  if (restartInterval) {
    clearInterval(restartInterval);
    restartInterval = null;
  }
}

function resetCompleteFlow() {
  if (completePanelTimeout) {
    clearTimeout(completePanelTimeout);
    completePanelTimeout = null;
  }
  stopRestartCountdown();
  document.getElementById("complete-screen").classList.remove("show");
  const celebrationLayer = document.getElementById("celebration-layer");
  celebrationLayer.classList.remove("active");
  celebrationLayer.innerHTML = "";
  hideSolvedImage();
}

function startRestartCountdown(restartAt) {
  stopRestartCountdown();
  const target = Number(restartAt) || (Date.now() + 30000);
  const el = document.getElementById("c-restart");

  const tick = () => {
    const remaining = Math.max(0, target - Date.now());
    el.textContent = `${Math.ceil(remaining / 1000)}s`;
    if (remaining <= 0) stopRestartCountdown();
  };

  tick();
  restartInterval = setInterval(tick, 250);
}

function showCompleteScreen(data) {
  const celebrationLayer = document.getElementById("celebration-layer");
  celebrationLayer.classList.remove("active");
  celebrationLayer.innerHTML = "";
  hideSolvedImage();
  const m = Math.floor(data.elapsed / 60);
  const s = String(data.elapsed % 60).padStart(2, "0");
  document.getElementById("c-time").textContent = `${m}:${s}`;
  document.getElementById("c-moves").textContent = data.moveCount;
  document.getElementById("lb-body").innerHTML = data.top5.map((u, i) => `
    <div class="lb-entry">
      <div class="lb-rank">${i + 1}</div>
      <div class="lb-name">${u.name}</div>
      <div class="lb-votes">${u.count} pts</div>
    </div>`).join("");
  startRestartCountdown(data.restartAt);
  document.getElementById("complete-screen").classList.add("show");
}

function startCompleteSequence(data) {
  movableCells = [];
  renderGrid();
  resetCompleteFlow();
  buildConfettiBurst();
  showSolvedImage();
  document.getElementById("celebration-layer").classList.add("active");

  const solvedAt = Number(data.restartAt) - RESTART_TOTAL_MS;
  const panelDelay = Math.max(0, COMPLETE_PANEL_DELAY_MS - Math.max(0, Date.now() - solvedAt));

  if (panelDelay === 0) {
    showCompleteScreen(data);
    return;
  }

  completePanelTimeout = setTimeout(() => {
    completePanelTimeout = null;
    showCompleteScreen(data);
  }, panelDelay);
}

// ── SOCKET EVENTS ─────────────────────────────────────────
socket.on("state_sync", d => {
  board = d.board; emptyPos = d.emptyPos;
  currentImage = d.currentImage;
  movableCells = d.movable || [];
  document.getElementById("stat-moves").textContent = d.moveCount;
  // Rebuild voteData from movable labels (empty counts on reconnect)
  voteData = {};
  (d.movableLabels || []).forEach((lbl, i) => {
    voteData[d.movable[i]] = { label: lbl, count: 0, firstTime: Infinity };
  });
  renderGrid(); renderVotes();
  if (d.puzzleComplete && d.completeStats) {
    if (clockInterval) clearInterval(clockInterval);
    startCompleteSequence(d.completeStats);
  } else {
    resetCompleteFlow();
    startClock(d.roundStartTime);
  }
});

socket.on("new_puzzle", d => {
  board = d.board; emptyPos = d.emptyPos;
  currentImage = d.currentImage;
  movableCells = []; voteData = {};
  document.getElementById("stat-moves").textContent = "0";
  resetCompleteFlow();
  renderGrid(); renderVotes();
  startClock();
});

socket.on("vote_start", d => {
  board = d.board; emptyPos = d.emptyPos;
  movableCells = d.movable;
  voteData = {};
  d.movable.forEach((idx, i) => {
    voteData[idx] = { label: d.movableLabels[i], count: 0, firstTime: Infinity };
  });
  renderGrid(); renderVotes();
  startTimer(d.duration);
});

socket.on("vote_cast", d => {
  if (voteData[d.index] !== undefined) {
    voteData[d.index].count = d.currentCount;
    if (voteData[d.index].firstTime === Infinity) voteData[d.index].firstTime = Date.now();
  }
  renderVotes();
});

socket.on("move_made", d => {
  document.getElementById("stat-moves").textContent = d.moveCount;
  const movingTile = board[d.movedCell];
  const oldCell = document.querySelector(`[data-tile="${movingTile}"]`);
  const oldRect = oldCell?.getBoundingClientRect();

  board = d.board; emptyPos = d.emptyPos;
  movableCells = []; voteData = {};
  renderGrid(); renderVotes();

  const newCell = document.querySelector(`[data-tile="${movingTile}"]`);
  const newRect = newCell?.getBoundingClientRect();

  if (!oldRect || !newRect || !newCell) return;

  const dx = oldRect.left - newRect.left;
  const dy = oldRect.top - newRect.top;

  if (dx === 0 && dy === 0) return;

  newCell.classList.add("sliding", "just-moved");
  newCell.style.transition = "none";
  newCell.style.transform = `translate(${dx}px, ${dy}px)`;
  void newCell.offsetWidth;
  newCell.style.transition = "transform 380ms cubic-bezier(0.22, 1, 0.36, 1)";
  newCell.style.transform = "translate(0, 0)";

  setTimeout(() => {
    newCell.classList.remove("sliding", "just-moved");
    newCell.style.transition = "";
    newCell.style.transform = "";
  }, 420);
});

socket.on("no_votes", d => {
  board = d.board; emptyPos = d.emptyPos;
  movableCells = []; voteData = {};
  renderGrid(); renderVotes();
});

socket.on("puzzle_complete", d => {
  if (clockInterval) clearInterval(clockInterval);
  startCompleteSequence(d);
});
</script>
</body>
</html>
